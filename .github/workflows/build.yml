name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekWhale
          path: dist/DeepSeekWhale.exe
